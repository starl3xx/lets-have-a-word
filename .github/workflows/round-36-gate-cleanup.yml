name: Round 36 gate cleanup reminder

# ONE-INCIDENT WORKFLOW, BORN WITH AN EXPIRY.
#
# PR #326 added 145 words (now 146) playable from round 36 only, because round
# 35 was live and its answer, bonus words and burn words were committed onchain
# from the smaller list. The era gate that makes that safe is temporary: once
# round 36 is underway nothing needs the old list, and leaving it in place
# strands dead branches on the guess hot path that no test will exercise again.
#
# Round 34 ran 26 days, so "remember to delete it when round 36 starts" is not
# a plan. This job watches the live round and opens an issue the day the
# expansion actually takes effect.
#
# DELETE THIS FILE as part of the cleanup it asks for. It is listed in the
# checklist below so it removes itself.

on:
  schedule:
    # 09:13 UTC daily. Off the hour on purpose: :00 is when every scheduled
    # workflow on GitHub fires at once and gets queued behind the stampede.
    - cron: '13 9 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-round:
    runs-on: ubuntu-latest
    steps:
      - name: Read the live round
        id: round
        run: |
          set -euo pipefail
          ROUND=$(curl -sS --max-time 30 --retry 3 --retry-delay 5 \
            https://letshaveaword.fun/api/round-state \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("roundId") or 0)')
          echo "Live round: $ROUND"
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"

      - name: Open the cleanup issue once round 36 is underway
        if: steps.round.outputs.round != '0' && fromJSON(steps.round.outputs.round) >= 36
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          set -euo pipefail
          TITLE="Delete the round-36 word list gate"

          # Idempotent: this job runs daily and must not open a new issue each
          # time. Search open AND closed, so a closed one is not reopened.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "Issue already exists, nothing to do."
            exit 0
          fi

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(cat <<EOF
Round **$ROUND** is underway, so the round-36 word list expansion has taken
effect and its era gate is now dead weight on the guess hot path.

Nothing needs the pre-36 list any more: guesses, the wheel and Superguess
pricing only ever ask about the round being played, and every round from here
is 36 or later.

## Delete

- [ ] \`WORDS_THROUGH_ROUND_35\` in \`src/data/guess_words_clean.ts\`
- [ ] \`LEGACY_WORDS_SET\`, \`WORD_LIST_EXPANSION_ROUND\`, \`isValidGuessForRound\`, \`getWordsForRound\`, \`wordSetForRound\` in \`src/lib/word-validation.ts\`
- [ ] the four call sites: \`src/lib/guesses.ts\` (step 5a), \`src/lib/wheel.ts\`, \`pages/api/superguess/status.ts\`, \`pages/api/superguess/purchase.ts\`
- [ ] the additive checks in \`validateWordLists()\` (\`src/lib/word-lists.ts\`)
- [ ] the two-era assertions in \`src/__tests__/word-lists.test.ts\`
- [ ] the "through round 35" halves of the counts in \`CLAUDE.md\`, \`README.md\`, \`docs/GITBOOK.md\`, \`docs/GAME_DOCUMENTATION.md\`
- [ ] **this workflow**, \`.github/workflows/round-36-gate-cleanup.yml\`

## Keep

\`ROUND_36_ADDITIONS\` can stay as its own array. It documents what was added
and when, and costs nothing once \`WORDS\` is the only list again.

## Do not re-derive

Answer and bonus selection were never gated, because \`createRound\` refuses to
run while a round is active. The client typing hint in \`pages/index.tsx\` is
deliberately not gated either: \`currentRoundId\` there is the archive modal's
round, not the live one.

_Opened automatically by \`.github/workflows/round-36-gate-cleanup.yml\`._
EOF
)"
